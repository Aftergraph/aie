# Diagnostic WORKS probe for STEWARD P2. Proof-only; do not merge.
version: 1

work:
  verify:
    triggers:
      - push
      - pull_request

    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core

    nodes:
      toolchain:
        run: |
          set -euo pipefail
          export PATH=/opt/works/node-current/bin:/usr/local/go/bin:/usr/local/bin:/usr/bin:/bin:$PATH
          command -v git
          command -v go
          command -v node
          command -v python3
          if command -v pnpm >/dev/null 2>&1; then
            pnpm --version >/dev/null
          elif command -v corepack >/dev/null 2>&1; then
            corepack --version >/dev/null
          elif command -v npx >/dev/null 2>&1; then
            npx --version >/dev/null
          else
            exit 41
          fi
          test -d /tmp
          printf 'STEWARD_P2_WORKS_TOOLCHAIN=PASS\n'
        cache: false
        timeout_s: 120
