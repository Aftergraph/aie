# Proof-only: physical Lenovo Computer Node v0.2 acceptance through WORKS.
# Do not merge. This branch is a live execution vehicle.
version: 1

work:
  lenovo-physical-acceptance:
    triggers:
      - push
      - pull_request

    requirements:
      confidence: development
      os: windows
      arch: amd64
      pool: jonas-lenovo

    nodes:
      acceptance:
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File proofs/lenovo/lenovo_works_acceptance.ps1
        cache: false
        timeout_s: 1200
