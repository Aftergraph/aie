# Diagnostic WORKS slice: Runtime -> WORKS exact-owner proof.
# Proof-only; do not merge.
version: 1

work:
  verify:
    triggers:
      - push
      - pull_request

    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core

    nodes:
      runtime-works:
        run: |
          set -euo pipefail
          export PATH=/opt/works/node-current/bin:/usr/local/go/bin:/usr/local/bin:/usr/bin:/bin:$PATH
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT

          git clone -q --filter=blob:none https://github.com/Aftergraph/STEWARD-by-Aftergraph.git "$root/steward"
          git -C "$root/steward" checkout -q 2fee57aa808a790afd073fd1525e730469764f0f

          git clone -q --filter=blob:none https://github.com/Aftergraph/runtime.git "$root/runtime"
          git -C "$root/runtime" checkout -q d9c5efb3a74222326ec71b06d5c2df2d4215d68f

          git clone -q --filter=blob:none https://github.com/Aftergraph/works-execution.git "$root/works"
          git -C "$root/works" checkout -q 64cabe65bf210b2c65b525750acb45fc6d53894d

          bash "$root/steward/scripts/p2_runtime_works_cross_process_proof.sh"             "$root/runtime" "$root/works"             d9c5efb3a74222326ec71b06d5c2df2d4215d68f             64cabe65bf210b2c65b525750acb45fc6d53894d
        cache: false
        timeout_s: 1200
