# works.yml — proof-only STEWARD P2 cross-process execution through Aftergraph WORKS.
#
# DO NOT MERGE. This branch uses AIE's already-wired WORKS webhook only as an
# execution vehicle so the canonical avc-core VDS pool can run the exact STEWARD
# P2 Runtime→WORKS proof. It grants no new authority and touches no production
# endpoint.
version: 1

work:
  steward-p2-runtime-works-proof:
    triggers:
      - push
      - pull_request

    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: tg-ci

    nodes:
      proof:
        run: |
          set -euo pipefail
          export PATH=/opt/works/node-current/bin:$PATH

          command -v git
          command -v go
          command -v node
          command -v corepack

          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT

          git clone -q https://github.com/Aftergraph/STEWARD-by-Aftergraph.git "$root/steward"
          git -C "$root/steward" checkout -q 6934f1b1944ae7a6671a2f46d76f3978caa2e365

          git clone -q https://github.com/Aftergraph/runtime.git "$root/runtime"
          git -C "$root/runtime" checkout -q d9c5efb3a74222326ec71b06d5c2df2d4215d68f

          git clone -q https://github.com/Aftergraph/works-execution.git "$root/works-execution"
          git -C "$root/works-execution" checkout -q 64cabe65bf210b2c65b525750acb45fc6d53894d

          bash "$root/steward/scripts/p2_runtime_works_cross_process_proof.sh" \
            "$root/runtime" \
            "$root/works-execution" \
            d9c5efb3a74222326ec71b06d5c2df2d4215d68f \
            64cabe65bf210b2c65b525750acb45fc6d53894d
        cache: false
        timeout_s: 1200
