# Proof-only WORKS pipeline for Aftergraph-native Windows worker cross-build.
# This branch is not intended for merge.
version: 1

work:
  verify:
    triggers:
      - push
      - pull_request

    requirements:
      confidence: development
      os: linux
      arch: amd64
      pool: avc-core

    nodes:
      windows-worker-crossbuild:
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          git clone --filter=blob:none https://github.com/Aftergraph/works-execution.git "$TMP_DIR/works-execution"
          git -C "$TMP_DIR/works-execution" fetch origin feat/windows-native-worker-v1
          git -C "$TMP_DIR/works-execution" checkout --detach 6b139cbbfe17deaebcbae2a8a66d9556a1b465d2
          test "$(git -C "$TMP_DIR/works-execution" rev-parse HEAD)" = "6b139cbbfe17deaebcbae2a8a66d9556a1b465d2"
          cd "$TMP_DIR/works-execution"
          go test ./internal/worker -run 'TestCommandShell' -count=1
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/works-worker-windows-amd64.exe ./cmd/works-worker
          test -s dist/works-worker-windows-amd64.exe
          sha256sum dist/works-worker-windows-amd64.exe
        timeout_s: 600
