agent {
    data_dir = "$AIE_S1_STATE/spire-agent/data"
    log_level = "INFO"
    server_address = "127.0.0.1"
    server_port = "18081"
    socket_path = "$AIE_S1_STATE/spire-agent/public/api.sock"
    trust_bundle_path = "$AIE_S1_STATE/bundle.pem"
    trust_domain = "aie.test"
}
plugins {
    NodeAttestor "join_token" { plugin_data {} }
    KeyManager "disk" {
        plugin_data { directory = "$AIE_S1_STATE/spire-agent/keys" }
    }
    WorkloadAttestor "unix" { plugin_data {} }
}
