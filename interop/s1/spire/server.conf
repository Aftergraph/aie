server {
    bind_address = "127.0.0.1"
    bind_port = "18081"
    socket_path = "$AIE_S1_STATE/spire-server/private/api.sock"
    trust_domain = "aie.test"
    data_dir = "$AIE_S1_STATE/spire-server/data"
    log_level = "INFO"
    default_x509_svid_ttl = "60s"
    agent_ttl = "60s"
}
plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "$AIE_S1_STATE/spire-server/datastore.sqlite3"
        }
    }
    NodeAttestor "join_token" { plugin_data {} }
    KeyManager "disk" {
        plugin_data { keys_path = "$AIE_S1_STATE/spire-server/keys.json" }
    }
}
