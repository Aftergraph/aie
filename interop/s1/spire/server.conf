server {
    bind_address = "127.0.0.1"
    bind_port = "18081"
    socket_path = "$AIE_S1_STATE/spire-server/private/api.sock"
    trust_domain = "aie.test"
    data_dir = "$AIE_S1_STATE/spire-server/data"
    log_level = "INFO"
    # ponytail: bound the lab rotation window. With the 24h default, the
    # old CA stays in the trust bundle for a day after SPIRE revokes it,
    # so the gateway's trust store never shrinks and the `old_trust_rejected`
    # gate cannot observe bundle propagation. Matching the CA TTL to the
    # SVID TTL (60s) keeps the lab's rotation-revocation cycle bounded
    # without changing the per-request trust semantics. Production SPIRE
    # deployments should keep the 24h default and enforce revocation at
    # the gateway via CRL/OCSP filtering, not by relying on bundle shrink.
    default_x509_svid_ttl = "60s"
    agent_ttl = "60s"
    ca_ttl = "90s"
}
plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "$AIE_S1_STATE/spire-server/datastore.sqlite3"
        }
    }
    NodeAttestor "join_token" { plugin_data {} }
    KeyManager "disk" {
        plugin_data { keys_path = "$AIE_S1_STATE/spire-server/keys.json" }
    }
}
