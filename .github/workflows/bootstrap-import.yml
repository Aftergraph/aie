name: Verify AIE bootstrap bundle

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify bootstrap bundle
        run: |
          cd .bootstrap
          sha256sum -c SHA256SUMS
      - name: Verify curated source in isolation
        run: |
          tmp="$(mktemp -d)"
          unzip -q .bootstrap/source.zip -d "$tmp"
          cd "$tmp"
          python -m compileall -q src interop/s1
          PYTHONPATH=src pytest -q
