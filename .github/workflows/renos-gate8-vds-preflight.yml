name: RenOS Gate 8 VDS Preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/renos-gate8-vds-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: [self-hosted, linux, x64, aie-interop]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: true

      - name: Probe VDS execution surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p renos-gate8-preflight
          {
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "node=$(node --version 2>/dev/null || true)"
            echo "npm=$(npm --version 2>/dev/null || true)"
            if command -v npx >/dev/null 2>&1 && npx --yes wrangler whoami >/tmp/renos-wrangler.out 2>/tmp/renos-wrangler.err; then
              echo "wrangler_auth=READY"
            else
              echo "wrangler_auth=NOT_READY"
              sed -n '1,12p' /tmp/renos-wrangler.err | sed -E 's/[A-Za-z0-9_\-]{24,}/[REDACTED]/g'
            fi
            if git ls-remote https://github.com/JonasAbde/Renos-Control.git refs/heads/main >/tmp/renos-main.out 2>/tmp/renos-git.err; then
              echo "renos_repo_read=READY"
              awk '{print "renos_main_sha="$1}' /tmp/renos-main.out
            else
              echo "renos_repo_read=NOT_READY"
              sed -n '1,12p' /tmp/renos-git.err
            fi
          } | tee renos-gate8-preflight/report.txt

          grep -q '^wrangler_auth=READY$' renos-gate8-preflight/report.txt
          grep -q '^renos_repo_read=READY$' renos-gate8-preflight/report.txt

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renos-gate8-vds-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: renos-gate8-preflight/report.txt
          if-no-files-found: error
          retention-days: 14
