name: CI

# Hosted Actions are billing-locked on this account: every job dies with
# startup_failure before any step runs, so a push-triggered hosted workflow
# only produces red X's on every commit. Verification now runs through the
# works control plane (see works.yml at repo root -> commit status
# `works/aie`) and the self-hosted aie-interop runner workflows. This
# workflow stays as the rollback path, manual-only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,otel]'
      - run: python -m compileall -q src interop/s1
      - run: pytest -q
