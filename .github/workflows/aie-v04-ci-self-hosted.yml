name: AIE v0.4 CI (self-hosted)

# In-house unit/contract CI that runs on the VDS self-hosted runner
# (same box as the S1.1 external interop gate). This exists because
# GitHub Actions on the JonasAbde account is billing-locked, which
# blocks the GH-hosted `ci.yml` matrix. Routing through the existing
# self-hosted runner costs zero GH minutes and survives the billing
# lock.
#
# Branch protection should require the `ci/test (<py>)` contexts
# posted by tools/ci_status_publisher.py at the end of this job.
# When the GH-hosted ci.yml is healthy, it remains a redundant
# fallback that posts the same context names — so the merge gate
# doesn't change, only the publisher does.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aie-v04-ci-self-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, linux, x64, aie-interop]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      UV_PREFIX: /home/aie-runner/.local
      # PYBIN gets rewritten by the first step; the rest of the
      # steps use bare `python` which works because the venv is
      # prepended to PATH via VIRTUAL_ENV/PATH.
      PATH: /home/aie-runner/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      AIE_CI_RESULTS: /home/aie-runner/aie-ci-results/${{ github.run_id }}-${{ github.run_attempt }}
      # Pinned dependency SHA: cross-repo tests never float on governance/main.
      GOVERNANCE_SHA: 1deb274cf716f4568b9e4d1af2b4d39e5de07486
      # Pinned org control-plane snapshot; consumed read-only for manifest validation.
      CONTROL_PLANE_SHA: c3f35d31a87d637a0243e87566a32925422fb584
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: true

      - name: Prepare clean-room namespaces
        run: |
          set -euo pipefail
          RUN_NAMESPACE="aie-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.python }}"
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          DEPENDENCY_ROOT="$GITHUB_WORKSPACE/.ci-dependencies"
          CONTROL_DIR="$GITHUB_WORKSPACE/.ci-dependencies/aftergraph-github"
          TEMP_ROOT="$RUNNER_TEMP/$RUN_NAMESPACE"
          UV_CACHE_DIR="$RUNNER_TEMP/uv-cache-$RUN_NAMESPACE"
          rm -rf "$DEPENDENCY_ROOT" "$TEMP_ROOT" "$UV_CACHE_DIR"
          mkdir -p "$DEPENDENCY_ROOT" "$TEMP_ROOT" "$UV_CACHE_DIR" "$AIE_CI_RESULTS"
          {
            echo "RUN_NAMESPACE=$RUN_NAMESPACE"
            echo "CHECKOUT_SHA=$CHECKOUT_SHA"
            echo "DEPENDENCY_ROOT=$DEPENDENCY_ROOT"
            echo "CONTROL_DIR=$CONTROL_DIR"
            echo "TEMP_ROOT=$TEMP_ROOT"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
          } >> "$GITHUB_ENV"

      # Dependency checkout is isolated from the test root and pinned to an
      # exact governance SHA. The old workspace-level sibling checkout caused
      # pytest collection collisions before testpaths was pinned in AIE #37.
      - name: Checkout pinned after-graph-governance dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Aftergraph/after-graph-governance
          ref: 1deb274cf716f4568b9e4d1af2b4d39e5de07486
          path: .ci-dependencies/after-graph-governance
          persist-credentials: false
          clean: true

      - name: Export governance contract path
        run: |
          echo "GOVERNANCE_DIR=$GITHUB_WORKSPACE/.ci-dependencies/after-graph-governance" >> "$GITHUB_ENV"
          echo "GOVERNANCE_CONTRACTS_PATH=$GITHUB_WORKSPACE/.ci-dependencies/after-graph-governance/docs/contracts/frozen" >> "$GITHUB_ENV"

      - name: Checkout pinned Aftergraph control-plane manifest
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Aftergraph/.github
          ref: c3f35d31a87d637a0243e87566a32925422fb584
          path: .ci-dependencies/aftergraph-github
          persist-credentials: false
          clean: true

      - name: Ensure uv + Python matrix + venv available
        # Single static binary, user-local, no sudo. Builds the
        # matrix Pythons on demand (cached by uv after the first
        # install). ~30s per build, ~120MB per Python. The venv
        # makes bare `python` resolve to the right interpreter
        # for every subsequent step.
        run: |
          set -euo pipefail
          export PATH="$UV_PREFIX/bin:$PATH"
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          uv --version
          uv python install ${{ matrix.python }}
          PYBIN="$(uv python find ${{ matrix.python }})"
          echo "PYBIN=$PYBIN" >> "$GITHUB_ENV"
          # Create a per-Python venv rooted in the runner's work
          # dir so it's cleaned up with the job. The venv's
          # bin/ goes to the FRONT of PATH so bare `python` and
          # `pip` resolve to the right interpreter.
          VENV="$RUNNER_TEMP/venv-${{ matrix.python }}"
          "$PYBIN" -m venv "$VENV"
          echo "VIRTUAL_ENV=$VENV" >> "$GITHUB_ENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" --version

      - name: Install package
        run: |
          set -euo pipefail
          export UV_CACHE_DIR="$UV_CACHE_DIR"
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,otel]'

      - name: Verify pinned polyrepo dependency manifest
        run: |
          set -euo pipefail
          python "$CONTROL_DIR/scripts/verify_polyrepo_heads.py" \
            "$CONTROL_DIR/execution/polyrepo-heads.json" \
            --head "Aftergraph/after-graph-governance=${GOVERNANCE_SHA}"

      - name: Verify runner clean-room contract
        run: |
          set -euo pipefail
          cat > "$AIE_CI_RESULTS/runner-clean-room.json" <<JSON
          {
            "repo": "${GITHUB_REPOSITORY}",
            "sha": "${CHECKOUT_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "attempt": ${GITHUB_RUN_ATTEMPT},
            "checkout_root": "${GITHUB_WORKSPACE}",
            "test_root": "${GITHUB_WORKSPACE}/tests",
            "dependency_root": "${DEPENDENCY_ROOT}",
            "temp_root": "${TEMP_ROOT}",
            "cache_namespace": "${RUN_NAMESPACE}",
            "dependencies": [{
              "name": "after-graph-governance",
              "path": "${DEPENDENCY_ROOT}/after-graph-governance",
              "sha": "${GOVERNANCE_SHA}"
            }, {
              "name": "aftergraph-github",
              "path": "${DEPENDENCY_ROOT}/aftergraph-github",
              "sha": "${CONTROL_PLANE_SHA}"
            }],
            "ports": {"isolated": true, "reserved": []},
            "cleanup": {"clean_before": true, "clean_after": true, "on_failure": "retain-evidence-only"}
          }
          JSON
          python "$GOVERNANCE_DIR/scripts/verify_runner_clean_room.py" "$AIE_CI_RESULTS/runner-clean-room.json"

      - name: Compile + pytest
        run: |
          set -euo pipefail
          mkdir -p "$AIE_CI_RESULTS"
          python -m compileall -q src interop/s1
          python -m pytest -q --junitxml="$AIE_CI_RESULTS/junit-${{ matrix.python }}.xml"

      - name: Persist runner-local evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$AIE_CI_RESULTS"
          python -m pip freeze > "$AIE_CI_RESULTS/requirements-${{ matrix.python }}.txt" || true
          python --version > "$AIE_CI_RESULTS/python-${{ matrix.python }}.txt"

      - name: Clean runner namespaces
        if: always()
        run: |
          set -euo pipefail
          rm -rf "$DEPENDENCY_ROOT" "$TEMP_ROOT" "$UV_CACHE_DIR"

      # Note: the in-house workflow's job result already publishes
      # a commit status under the "test (<py>)" context automatically
      # (the job's own check). tools/ci_status_publisher.py is kept
      # as a standalone tool for ad-hoc / manual status posts from
      # outside a GH Actions run — see tests/test_ci_status_publisher.py
      # and docs/inhouse-ci-research.md.
