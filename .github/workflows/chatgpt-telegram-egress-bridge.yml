name: ChatGPT Telegram egress bridge

on:
  push:
    branches:
      - ops/chatgpt-telegram-egress-bridge-20260906

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, aie-interop]
    timeout-minutes: 5
    steps:
      - name: Probe runner
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_OK"
          echo "HOST=$(hostname)"
          echo "USER=$(id -un)"
          if command -v hermes >/dev/null 2>&1; then echo "HERMES_PRESENT=true"; else echo "HERMES_PRESENT=false"; fi
          for p in "$HOME/.hermes/profiles/avc" /root/.hermes/profiles/avc /etc/avc-control/secrets /opt/avc-control; do
            if [ -e "$p" ]; then echo "PATH_PRESENT=$p"; fi
          done
