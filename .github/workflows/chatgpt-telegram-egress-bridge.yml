name: ChatGPT Telegram egress bridge

on:
  push:
    branches:
      - ops/chatgpt-telegram-egress-bridge-20260906

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, aie-interop]
    timeout-minutes: 5
    steps:
      - name: Inspect environment key names only
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_OK HOST=$(hostname) USER=$(id -un)"
          for f in /etc/hermes-forge/forge.env /etc/avc-runner-bridge.env; do
            if [[ -r "$f" ]]; then
              echo "ENV_FILE=$f"
              sed -n -E 's/^[[:space:]]*(export[[:space:]]+)?([A-Za-z_][A-Za-z0-9_]*)=.*/\2/p' "$f" \
                | grep -Ei 'telegram|(^|_)tg(_|$)|bot|chat|notify|hermes' \
                | sort -u \
                | sed 's/$/=<redacted>/' || true
            fi
          done
          echo "FORGE_STATUS_BEGIN"
          systemctl is-active hermes-forge-deploy.service 2>/dev/null || true
          systemctl is-active hermes-forge-mcp-ci.service 2>/dev/null || true
          echo "FORGE_STATUS_END"
