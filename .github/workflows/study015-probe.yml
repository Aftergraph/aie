name: STUDY-015 Component Probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, aie-interop]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run local implementation probe
        run: |
          set -euo pipefail
          python3 scripts/study015_probe.py > study015-probe.json
          python3 - <<'PY'
          import json, subprocess
          r=json.load(open("study015-probe.json"))
          head=subprocess.check_output(["git","rev-parse","HEAD"], text=True).strip()
          assert r["schema"]=="study015.probe/1.0"
          assert r["component"]=="aie"
          assert r["source_head"]==head
          assert r["network_used"] is False
          assert all(r["mechanisms"].values())
          print("STUDY015_AIE_PROBE=PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: study015-probe-aie-${{ github.event.pull_request.head.sha || github.sha }}
          path: study015-probe.json
          if-no-files-found: error
          retention-days: 14
