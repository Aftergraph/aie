name: Enable WORKS Sentinel verifier credential

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-works-verifier-credential.yml'

permissions:
  contents: read

concurrency:
  group: enable-works-verifier-credential
  cancel-in-progress: false

jobs:
  enable:
    runs-on: [self-hosted, linux, x64, aie-interop]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: true

      - name: Preflight exact production WORKS boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          systemctl is-active --quiet works-api.service
          curl -fsS --max-time 2 http://127.0.0.1:18191/healthz >/dev/null
          test -f /etc/works/works.env
          test "$(stat -c '%u:%g' /etc/works/works.env)" = "0:0"
          mode="$(stat -c '%a' /etc/works/works.env)"
          case "$mode" in 400|600|640) ;; *) echo "unexpected works.env mode: $mode" >&2; exit 1 ;; esac
          sudo -n true
          status="$(curl -sS -o "$RUNNER_TEMP/preflight-verifier.json" -w '%{http_code}' --max-time 2 -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-WORKS-Verifier-Token: definitely-wrong-preflight-token-000000000000' \
            --data '{"result":"passed","verifier_id":"sentinel:credential-preflight","evidence_ref":"dvr_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","verified_at":"2026-09-20T08:00:00Z"}' \
            http://127.0.0.1:18191/v1/works/wrk_preflight_not_real/verification || true)"
          case "$status" in
            401) echo "WORKS verifier ingest already configured; mutation may be unnecessary" ;;
            503) echo "WORKS verifier ingest is fail-closed and ready for credential activation" ;;
            *) echo "unexpected verifier preflight status: $status" >&2; exit 1 ;;
          esac

      - name: Generate or retain verifier credential and restart fail-closed
        shell: bash
        run: |
          set -euo pipefail
          sudo -n bash <<'ROOT'
          set -euo pipefail
          umask 077

          env_file=/etc/works/works.env
          backup="$(mktemp /run/works.env.before-verifier.XXXXXX)"
          cp -a -- "$env_file" "$backup"

          rollback() {
            cp -a -- "$backup" "$env_file"
            systemctl restart works-api.service || true
          }
          trap 'rollback' ERR

          set -a
          # shellcheck disable=SC1090
          source "$env_file"
          set +a
          current="${WORKS_VERIFIER_TOKEN:-}"

          if [[ ${#current} -lt 32 ]]; then
            token="$(openssl rand -hex 32)"
            tmp="$(mktemp /etc/works/.works.env.verifier.XXXXXX)"
            awk '!/^WORKS_VERIFIER_TOKEN=/' "$env_file" >"$tmp"
            printf 'WORKS_VERIFIER_TOKEN=%s\n' "$token" >>"$tmp"
            chown --reference="$env_file" "$tmp"
            chmod --reference="$env_file" "$tmp"
            mv -f -- "$tmp" "$env_file"
            token=""
          fi
          current=""

          systemctl restart works-api.service

          healthy=false
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 1 http://127.0.0.1:18191/healthz >/dev/null 2>&1; then
              healthy=true
              break
            fi
            sleep 0.5
          done
          [[ "$healthy" == true ]]

          verifier_status="$(curl -sS -o /run/works-verifier-post.json -w '%{http_code}' --max-time 2 -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-WORKS-Verifier-Token: definitely-wrong-post-token-000000000000000' \
            --data '{"result":"passed","verifier_id":"sentinel:credential-postcheck","evidence_ref":"dvr_bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","verified_at":"2026-09-20T08:00:00Z"}' \
            http://127.0.0.1:18191/v1/works/wrk_postcheck_not_real/verification || true)"
          [[ "$verifier_status" == 401 ]]

          enrollment_status="$(curl -sS -o /run/works-enroll-post.json -w '%{http_code}' --max-time 2 -X POST \
            -H 'Content-Type: application/json' \
            --data '{"worker_id":"wrkr_credential_postcheck","challenge":"definitely-wrong-postcheck-challenge"}' \
            http://127.0.0.1:18191/v1/workers/enroll || true)"
          [[ "$enrollment_status" == 401 ]]

          rm -f -- "$backup" /run/works-verifier-post.json /run/works-enroll-post.json
          trap - ERR

          printf '{"works_health":true,"verification_ingest_configured":true,"wrong_verifier_token_status":401,"worker_enrollment_preserved":true,"wrong_enrollment_challenge_status":401}\n'
          ROOT

      - name: Independent non-secret postcheck
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-active --quiet works-api.service
          curl -fsS --max-time 2 http://127.0.0.1:18191/healthz >/dev/null

          status="$(curl -sS -o "$RUNNER_TEMP/final-verifier.json" -w '%{http_code}' --max-time 2 -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-WORKS-Verifier-Token: definitely-wrong-final-token-00000000000000' \
            --data '{"result":"passed","verifier_id":"sentinel:credential-final","evidence_ref":"dvr_cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc","verified_at":"2026-09-20T08:00:00Z"}' \
            http://127.0.0.1:18191/v1/works/wrk_final_not_real/verification || true)"
          test "$status" = "401"

          enroll="$(curl -sS -o "$RUNNER_TEMP/final-enroll.json" -w '%{http_code}' --max-time 2 -X POST \
            -H 'Content-Type: application/json' \
            --data '{"worker_id":"wrkr_credential_final","challenge":"definitely-wrong-final-challenge"}' \
            http://127.0.0.1:18191/v1/workers/enroll || true)"
          test "$enroll" = "401"

          echo '{"credential_value_exposed":false,"works_verifier_ingest":true,"worker_enrollment_preserved":true}'
